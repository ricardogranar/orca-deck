<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orca Deck</title>
<style>
@font-face{font-family:Geist;src:url(fonts/Geist.woff2) format("woff2");font-weight:100 900}
/* Orca dark theme tokens (from Orca's renderer CSS) */
:root{
  --background:#0a0a0a; --card:#171717; --muted:#262626; --accent:#404040; --border:#ffffff12;
  --foreground:#f0f0f0; --muted-foreground:#acacac; --faint:#6b6b6b; --primary:#e5e5e5; --primary-foreground:#171717;
  --working:#60a5fa; --waiting:#fbbf24; --done:#34d399; --idle:#737373;
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:var(--background);color:var(--foreground);overflow:hidden;
  font-family:Geist,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* Fixed 936×526 canvas (iPhone 8 landscape via OpenDisplay), scaled to fit the window. */
#stage{position:absolute;inset:0;display:grid;place-items:center}
#app{width:936px;height:526px;position:relative;zoom:var(--fit,1);overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column;transition:opacity .2s,transform .25s}
.view.hidden{opacity:0;pointer-events:none;transform:translateX(30px)}

/* ── header ── */
.head{height:76px;flex:none;display:flex;align-items:center;gap:14px;padding:0 28px}
.logo{width:40px;height:40px;border-radius:10px}
.summary{font-size:26px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.summary .attn{color:var(--waiting)} .summary .sep{color:var(--accent);margin:0 6px}
.summary .dim{color:var(--muted-foreground);font-weight:500}
.grow{flex:1}
.clock{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--muted-foreground)}
.bell{width:60px;height:60px;border-radius:16px;background:var(--card);display:grid;place-items:center;color:var(--muted-foreground)}
.bell svg{width:26px;height:26px}
.offline{position:absolute;left:28px;right:28px;top:76px;bottom:28px;display:none;place-items:center;text-align:center;
  background:var(--background);z-index:3}
.offline.on{display:grid}
.offline b{display:block;font-size:40px;font-weight:600;margin-bottom:8px}
.offline span{font-size:24px;color:var(--muted-foreground)}

/* ── layouts ── */
#rail{flex:1;min-height:0;padding:4px 28px 0}
#rail::-webkit-scrollbar,.scroller::-webkit-scrollbar{display:none}
.lay-carousel{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 28px}
.lay-carousel.dragging{scroll-snap-type:none}
.lay-list{display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding-bottom:22px!important}
.lay-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:206px;gap:14px;overflow-y:auto;padding-bottom:22px!important}
.lay-focus{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding-bottom:22px!important;overflow:hidden}
.lay-focus .card{width:auto;max-height:none;height:auto}
.lay-focus .card .title{font-size:40px}
.lay-focus .card .now{-webkit-line-clamp:3}
.side{display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0}
.side .none{font-size:20px;color:var(--faint);padding:18px 6px}

/* list rows */
.row{flex:none;min-height:80px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:10px 14px 10px 22px;
  display:flex;align-items:center;gap:16px;cursor:pointer}
.row.waiting{border:2px solid var(--waiting);background:linear-gradient(90deg,#2a2208 0%,var(--card) 60%)}
.rtx{flex:1;min-width:0}
.rt{font-size:25px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rn{font-size:19px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row.waiting .rn{color:#fde68a}
.rtime{font-size:19px;color:var(--muted-foreground);font-variant-numeric:tabular-nums;flex:none;padding-right:8px}
.sbtn{height:58px;min-width:76px;border-radius:14px;padding:0 18px;font-size:21px;font-weight:600;background:var(--muted);flex:none}
.sbtn.yes{background:var(--waiting);color:#1c1300}
.sbtn:active{transform:scale(.96)}

/* grid tiles */
.tile{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;cursor:pointer;min-width:0}
.tile.waiting{border:2px solid var(--waiting);background:linear-gradient(180deg,#2a2208 0%,var(--card) 70%)}
.tile .pill{font-size:18px;gap:8px} .tile .dot{width:12px;height:12px}
.tile .tt{font-size:23px;line-height:1.18;font-weight:600;margin-top:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .tn{font-size:17px;line-height:1.3;color:var(--muted-foreground);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .tw{font-size:16px;color:var(--faint);margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ans{display:flex;gap:8px;margin-top:auto} .tile .ans .sbtn{flex:1;height:54px}

/* focus side strip */
.mini{flex:none;min-height:72px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:10px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.mini.waiting{border:2px solid var(--waiting)}
.mini .rt{font-size:20px} .mini .rn{font-size:16px}

.card{flex:none;width:430px;height:100%;max-height:398px;scroll-snap-align:start;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:24px 26px 22px;display:flex;flex-direction:column;cursor:pointer;position:relative;transition:transform .15s}
.card:active{transform:scale(.985)}
.card.waiting{border:2px solid var(--waiting);background:linear-gradient(180deg,#2a2208 0%,var(--card) 55%)}
.pill{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:600;color:var(--c)}
.pill .t{margin-left:auto;color:var(--muted-foreground);font-weight:500;font-variant-numeric:tabular-nums}
.dot{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.working{--c:var(--working)} .waiting{--c:var(--waiting)} .done{--c:var(--done)} .idle{--c:var(--idle)}
.working .dot{animation:pulse 1.4s ease-in-out infinite}
.waiting .dot{animation:pulse .8s ease-in-out infinite}
.new{width:12px;height:12px;border-radius:50%;background:var(--foreground)}
.title{font-size:36px;line-height:1.14;font-weight:600;letter-spacing:-.02em;margin-top:16px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.now{font-size:22px;line-height:1.3;color:var(--muted-foreground);margin-top:12px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.waiting .now{color:#fde68a}
.where{font-size:19px;color:var(--faint);margin-top:auto;padding-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.answers{display:flex;gap:12px;margin-top:auto;padding-top:14px}
.btn{height:66px;border-radius:16px;padding:0 24px;font-size:24px;font-weight:600;background:var(--muted);display:flex;align-items:center;justify-content:center;gap:10px;flex:none}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--primary);color:var(--primary-foreground)}
.btn.yes{background:var(--waiting);color:#1c1300;flex:1}
.btn.no{flex:1}
.btn svg{width:24px;height:24px}
#dots{height:30px;flex:none;display:flex;justify-content:center;align-items:center;gap:8px}
#dots i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
#dots i.on{background:var(--foreground);width:22px;border-radius:4px}

/* empty */
.calm{flex:1;display:grid;place-items:center;text-align:center;padding-bottom:30px}
.calm .big{font-size:132px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.calm .msg{font-size:26px;color:var(--muted-foreground);margin-top:14px}

/* ── detail ── */
.dhead{height:92px;flex:none;display:flex;align-items:center;gap:16px;padding:0 28px}
.back{height:60px;padding:0 20px 0 14px;border-radius:16px;background:var(--card);font-size:24px;font-weight:600;display:flex;align-items:center;gap:6px}
.back svg{width:28px;height:28px}
.dtitle{font-size:34px;line-height:1.15;font-weight:600;letter-spacing:-.02em;padding:0 28px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:none}
.dwhere{font-size:20px;color:var(--faint);padding:6px 28px 0;flex:none}
#dbody{flex:1;overflow-y:auto;margin:14px 28px 0;font-size:24px;line-height:1.4;color:#d4d4d4;min-height:0}
#dbody::-webkit-scrollbar{display:none}
#dbody p+p{margin-top:10px}
#dbody .lbl{font-size:18px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
#dbody .ask{font-size:28px;color:#fde68a;font-weight:500}
#dbody.term{background:#000;border:1px solid var(--border);border-radius:16px;padding:14px 16px;
  font:17px/1.3 "SF Mono",ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#d4d4d4}
.dactions{height:100px;flex:none;display:flex;gap:12px;align-items:center;padding:0 28px}

/* ── settings ── */
.stitle{font-size:30px;font-weight:600;letter-spacing:-.02em}
#sbody{flex:1;min-height:0;overflow-y:auto;padding:0 28px 24px}
.srow{display:flex;align-items:center;gap:20px;padding:14px 0;border-bottom:1px solid var(--border)}
.srow:last-child{border-bottom:0}
.slbl{flex:1;min-width:0}
.slbl b{display:block;font-size:22px;font-weight:600}
.slbl span{display:block;font-size:16px;color:var(--faint);margin-top:3px}
.seg{display:flex;gap:4px;padding:4px;background:var(--card);border-radius:16px;flex:none}
.seg button{height:54px;padding:0 15px;border-radius:12px;font-size:19px;font-weight:600;color:var(--muted-foreground)}
.seg button.on{background:var(--accent);color:var(--foreground)}
.tog{width:88px;height:52px;border-radius:26px;background:var(--muted);position:relative;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;top:5px;left:5px;width:42px;height:42px;border-radius:50%;background:#d4d4d4;transition:transform .15s}
.tog.on{background:var(--done)} .tog.on::after{transform:translateX(36px);background:#fff}

/* ── alerts ── */
#banner{position:absolute;left:20px;right:20px;top:10px;min-height:96px;z-index:8;display:flex;align-items:center;gap:14px;padding:10px 12px 10px 22px;
  background:#2a2208;border:2px solid var(--waiting);border-radius:20px;box-shadow:0 10px 40px #000c;transform:translateY(-140px);transition:transform .25s}
#banner.on{transform:none}
#banner .rn{color:#fde68a}
#alert{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;padding:30px 36px 28px;
  background:radial-gradient(120% 90% at 50% 0%,#3a2d06 0%,#0a0a0a 70%)}
#alert.on{display:flex}
#alert .pill{font-size:26px}
#alert .atitle{font-size:46px;line-height:1.1;font-weight:600;letter-spacing:-.02em;margin-top:18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#alert .aask{font-size:26px;line-height:1.3;color:#fde68a;margin-top:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#alert .arow{display:flex;gap:12px;margin-top:auto}
#app.glow::after{content:"";position:absolute;inset:0;border:6px solid var(--waiting);border-radius:14px;pointer-events:none;z-index:7;animation:pulse 1s ease-in-out infinite}

#toast{position:absolute;left:50%;bottom:22px;transform:translate(-50%,120px);background:var(--primary);color:var(--primary-foreground);
  font-size:24px;font-weight:600;padding:14px 26px;border-radius:16px;transition:transform .25s;z-index:9;white-space:nowrap}
#toast.on{transform:translate(-50%,0)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div id="stage"><div id="app">

  <!-- HOME -->
  <section class="view" id="home">
    <div class="head">
      <img class="logo" src="orca.png" alt="">
      <div class="summary" id="summary"></div>
      <div class="grow"></div>
      <div class="clock" id="clock">--:--</div>
      <button class="bell" id="bell" data-act="sound"></button>
      <button class="bell" id="gear" data-act="settings"></button>
    </div>
    <div id="rail"></div>
    <div id="dots"></div>
  </section>

  <!-- DETAIL -->
  <section class="view hidden" id="detail">
    <div class="dhead">
      <button class="back" data-act="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Volver</button>
      <div class="pill" id="dpill"></div>
    </div>
    <div class="dtitle" id="dtitle"></div>
    <div class="dwhere" id="dwhere"></div>
    <div id="dbody" class="scroller"></div>
    <div class="dactions" id="dactions"></div>
  </section>

  <!-- SETTINGS -->
  <section class="view hidden" id="settings">
    <div class="dhead">
      <button class="back" data-act="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Volver</button>
      <div class="stitle">Ajustes</div>
    </div>
    <div id="sbody" class="scroller"></div>
  </section>

  <div id="banner"></div>
  <div id="alert"></div>
  <div class="offline" id="offline"><div><b>Orca no responde</b><span>Abre Orca en el Mac y esto se conecta solo.</span></div></div>
  <div id="toast"></div>
</div></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem("deck." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem("deck." + k, JSON.stringify(v)); } catch {} },
};
const ICON = {
  open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>',
  term: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-5-6-5M12 19h8"/></svg>',
  text: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  bellOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 003.4 0"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 00-2 2v.18a2 2 0 01-1 1.73l-.43.25a2 2 0 01-2 0l-.15-.08a2 2 0 00-2.73.73l-.22.38a2 2 0 00.73 2.73l.15.1a2 2 0 011 1.72v.51a2 2 0 01-1 1.74l-.15.09a2 2 0 00-.73 2.73l.22.38a2 2 0 002.73.73l.15-.08a2 2 0 012 0l.43.25a2 2 0 011 1.73V20a2 2 0 002 2h.44a2 2 0 002-2v-.18a2 2 0 011-1.73l.43-.25a2 2 0 012 0l.15.08a2 2 0 002.73-.73l.22-.39a2 2 0 00-.73-2.73l-.15-.08a2 2 0 01-1-1.74v-.5a2 2 0 011-1.74l.15-.09a2 2 0 00.73-2.73l-.22-.38a2 2 0 00-2.73-.73l-.15.08a2 2 0 01-2 0l-.43-.25a2 2 0 01-1-1.73V4a2 2 0 00-2-2z"/><circle cx="12" cy="12" r="3"/></svg>',
  bellOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.7 3A6 6 0 0118 8a21.3 21.3 0 00.6 5M17 17H3s3-2 3-9a4.67 4.67 0 01.3-1.7M10.3 21a1.94 1.94 0 003.4 0M2 2l20 20"/></svg>',
};

/* ── native bridge ── */
const native = window.webkit?.messageHandlers?.orca;
let seq = 0; const pending = new Map();
function call(op, extra = {}) {
  if (!native) return Promise.resolve({ ok: false, error: { message: "sin app nativa" } });
  const id = ++seq;
  return new Promise(res => { pending.set(id, res); native.postMessage({ id, op, ...extra }); });
}
const orca = (...args) => call("orca", { args });

/* ── preferences (gear menu) ── */
const DEF = { layout: "carousel", show: "active", alert: "jump", doneFor: 4, sndWait: true, sndDone: true, restoreCursor: true, autoHome: true };
const P = Object.assign({}, DEF, store.get("prefs", {}));
if (!native) for (const [k, v] of new URLSearchParams(location.search)) if (k in DEF) P[k] = typeof DEF[k] === "number" ? +v : typeof DEF[k] === "boolean" ? v === "1" : v;
const SETTINGS = [
  ["layout", "Vista", "Cómo se colocan los agentes", [["carousel", "Carrusel"], ["list", "Lista"], ["focus", "Foco"], ["grid", "Mosaico"]]],
  ["show", "Mostrar", "Qué agentes aparecen", [["active", "Activos"], ["attention", "Solo urgentes"], ["all", "Todos"]]],
  ["alert", "Cuando un agente te necesita", "Saltar a su tarjeta, banner arriba, alerta a pantalla completa o solo un borde", [["jump", "Saltar"], ["banner", "Banner"], ["full", "Grande"], ["glow", "Borde"]]],
  ["doneFor", "Terminados visibles", "Cuánto siguen en «Activos»", [[1, "1 h"], [4, "4 h"], [12, "12 h"]]],
  ["sndWait", "Sonido cuando te necesita", "Si el sonido general está activado"],
  ["sndDone", "Sonido cuando termina", "Si el sonido general está activado"],
  ["restoreCursor", "Devolver el puntero al Mac", "Al tocar el iPhone, el ratón vuelve a donde estaba y no se ve en el iPhone"],
  ["autoHome", "Volver al inicio solo", "Tras 1 min sin tocar la pantalla"],
];
function setPref(k, v) {
  P[k] = v; store.set("prefs", P);
  if (k === "restoreCursor") call("prefs", { restoreCursor: v });
  if (k === "layout") { const r = $("#rail"); r.scrollLeft = r.scrollTop = 0; }
  renderSettings(); render();
}
call("prefs", { restoreCursor: P.restoreCursor });

/* ── state ── */
const S = { agents: [], byKey: new Map(), prev: store.get("prev", {}), sel: null, view: "summary",
  sound: store.get("sound", true), lastOk: Date.now(), screenText: "", lastTouch: Date.now(), alertKey: null, dirty: false };
let drag = null, moved = false, holdFocus = false;

function kind(state) {
  const s = String(state || "").toLowerCase();
  if (/wait|block|perm|input|question|approv|attention|ask/.test(s)) return "waiting";
  if (/work|run|think|busy|stream|start/.test(s)) return "working";
  if (/done|complete|finish|success/.test(s)) return "done";
  return "idle";
}
const LABEL = { waiting: "Te necesita", working: "Trabajando", done: "Listo", idle: "En pausa" };
const GENERIC = /^(claude|codex|gemini|agent|chat|new|terminal \d+)( (chat|session|agent))?$/i;
function titleOf(a) {
  const pick = [a.taskTitle, a.displayName, a.conversationName, a.activity?.title, a.prompt]
    .map(x => String(x || "").split("\n")[0].replace(/^\/\S+\.(srt|txt|md|png|jpg|pdf)\s*/i, "").trim())
    .find(x => x && !GENERIC.test(x));
  return pick || a.conversationName || "Agente";
}
function ago(ms) {
  if (!ms) return "";
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 60) return "ahora";
  if (s < 3600) return Math.floor(s / 60) + " min";
  if (s < 86400) return Math.floor(s / 3600) + " h";
  return Math.floor(s / 86400) + " d";
}
const clean = s => String(s || "").replace(/^\s*[-*]\s+/, "• ").replace(/```[\s\S]*?```/g, " ").replace(/[#>*_`|]+/g, " ").replace(/\s+/g, " ").trim();
function firstSentence(md) {
  const line = String(md || "").split("\n").map(clean).find(l => l.length > 3) || "";
  return line;
}
function toolText(a) {
  if (!a.toolName) return "";
  let inp = String(a.toolInput || "").split("\n")[0].trim();
  if (/^(Read|Edit|Write|MultiEdit|Glob|NotebookEdit)$/.test(a.toolName) && inp.includes("/")) inp = inp.split("/").pop();
  const verb = { Read: "Leyendo", Edit: "Editando", MultiEdit: "Editando", Write: "Escribiendo", Bash: "Ejecutando",
    Grep: "Buscando", Glob: "Buscando", WebFetch: "Leyendo web", WebSearch: "Buscando en la web", Task: "Delegando", Agent: "Delegando" }[a.toolName] || a.toolName;
  return verb + (inp ? " · " + (inp.length > 80 ? inp.slice(0, 80) + "…" : inp) : "");
}
function askText(a) {
  if (!a.toolName) return "Está esperando tu respuesta";
  const inf = { Read: "leer", Edit: "editar", MultiEdit: "editar", Write: "crear", Bash: "ejecutar", WebFetch: "abrir",
    WebSearch: "buscar", Grep: "buscar", Glob: "buscar", Task: "lanzar un subagente", Agent: "lanzar un subagente" }[a.toolName] || "usar " + a.toolName;
  const inp = toolText(a).split(" · ").slice(1).join(" · ");
  return "Quiere " + inf + (inp ? ": " + inp : "");
}
function nowText(a) {
  if (a.k === "waiting") return askText(a);
  if (a.k === "working") return toolText(a) || "Pensando…";
  return firstSentence(a.lastAssistantMessage);
}

/* ── data in ── */
window.deck = {
  update(ps, terms) {
    if (!ps?.ok) { setOnline(false); return; }
    setOnline(true);
    const handles = new Map((terms?.result?.terminals || []).map(t => [t.tabId + ":" + t.leafId, t.handle]));
    const list = [];
    for (const w of ps.result.worktrees || []) for (const a of w.agents || []) {
      list.push({ ...a, w, key: w.worktreeId + "|" + a.paneKey, k: kind(a.state),
        handle: handles.get(a.paneKey) || null, fresh: !!(a.activity?.unread || w.unread),
        at: a.stateStartedAt || a.updatedAt || 0 });
    }
    const alertKey = changes(list);
    S.agents = list; S.byKey = new Map(list.map(a => [a.key, a]));
    render();
    if (alertKey) raiseAlert(alertKey);
  },
  reply(id, json) { const r = pending.get(id); if (r) { pending.delete(id); r(json); } },
};
function setOnline(ok) { if (ok) S.lastOk = Date.now(); $("#offline").classList.toggle("on", !ok); }

function changes(list) {
  const first = !Object.keys(S.prev).length, next = {};
  let chime = null, alertKey = null;
  for (const a of list) {
    next[a.key] = a.k;
    const was = S.prev[a.key];
    if (first || was === a.k) continue;
    if (a.k === "waiting") { if (P.sndWait) chime = "Funk"; alertKey = alertKey || a.key; }
    else if (a.k === "done" && was === "working" && P.sndDone) { chime = chime || "Glass"; }
  }
  S.prev = next; store.set("prev", next);
  if (chime && S.sound) call("sound", { name: chime });
  return alertKey;
}

/* ── "an agent needs you" styles ── */
function raiseAlert(key) {
  const a = S.byKey.get(key); if (!a) return;
  if (P.alert === "jump") {
    showHome(); requestAnimationFrame(() => $("#rail").scrollTo({ left: 0, top: 0, behavior: "smooth" }));
  } else if (P.alert === "banner") {
    S.alertKey = key; paintAlerts();
    clearTimeout(raiseAlert.h); raiseAlert.h = setTimeout(closeAlerts, 10e3);
  } else if (P.alert === "full") {
    S.alertKey = key; paintAlerts();
  } else if (P.alert === "glow") {
    $("#app").classList.add("glow"); clearTimeout(raiseAlert.g); raiseAlert.g = setTimeout(() => $("#app").classList.remove("glow"), 12e3);
  }
}
function closeAlerts() { S.alertKey = null; $("#banner").classList.remove("on"); $("#alert").classList.remove("on"); }
function paintAlerts() {
  const a = S.alertKey && S.byKey.get(S.alertKey);
  if (!a || a.k !== "waiting") { if (S.alertKey) closeAlerts(); $("#app").classList.toggle("glow", $("#app").classList.contains("glow") && S.agents.some(x => x.k === "waiting")); return; }
  const yn = a.handle ? `<button class="sbtn yes" data-act="yes">Sí</button><button class="sbtn" data-act="no">No</button>` : "";
  if (P.alert === "banner") {
    const B = $("#banner"); B.dataset.key = a.key;
    B.innerHTML = `<span class="dot" style="--c:var(--waiting)"></span><div class="rtx"><div class="rt">${esc(titleOf(a))}</div><div class="rn">${esc(askText(a))}</div></div>
      ${yn}<button class="sbtn" data-act="view">Ver</button>`;
    B.classList.add("on");
  } else {
    const A = $("#alert"); A.dataset.key = a.key;
    A.innerHTML = `<div class="pill waiting"><span class="dot"></span>Te necesita<span class="t">${esc(a.w.repo)} · ${esc(a.w.displayName || "")}</span></div>
      <div class="atitle">${esc(titleOf(a))}</div><div class="aask">${esc(askText(a))}</div>
      <div class="arow">${a.handle ? `<button class="btn yes" data-act="yes">${ICON.check} Sí</button><button class="btn no" data-act="no">No</button>` : ""}
        <button class="btn" data-act="view">Ver</button><button class="btn" data-act="dismiss">Luego</button></div>`;
    A.classList.add("on");
  }
}

/* ── what the home rail shows ── */
const RECENT = 4 * 3600e3, MAX = 8, ORDER = { waiting: 0, working: 1, done: 2, idle: 3 };
function visible() {
  const recent = P.doneFor * 3600e3 || RECENT;
  const keep = P.show === "all" ? () => true
    : P.show === "attention" ? a => a.k === "waiting" || (a.fresh && a.k !== "working")
    : a => a.k === "waiting" || a.k === "working" || a.fresh || (a.k === "done" && Date.now() - a.at < recent);
  return S.agents.filter(keep)
    .sort((x, y) => ORDER[x.k] - ORDER[y.k] || (y.fresh - x.fresh) || (y.at - x.at))
    .slice(0, P.layout === "carousel" ? MAX : 40);
}

/* ── render ── */
function render() {
  if (drag && moved) { S.dirty = true; return; }   // don't rebuild what the finger is dragging
  S.dirty = false;
  const vis = visible();
  const c = { waiting: 0, working: 0, done: 0 };
  for (const a of S.agents) if (a.k !== "done" && a.k in c) c[a.k]++;
  for (const a of vis) if (a.k === "done") c.done++;
  const parts = [];
  if (c.waiting) parts.push(`<span class="attn">${c.waiting} te ${c.waiting > 1 ? "necesitan" : "necesita"}</span>`);
  if (c.working) parts.push(`${c.working} trabajando`);
  if (c.done) parts.push(`<span class="dim">${c.done} ${c.done > 1 ? "listos" : "listo"}</span>`);
  $("#summary").innerHTML = parts.join('<span class="sep">·</span>') || '<span class="dim">Orca</span>';
  $("#bell").innerHTML = S.sound ? ICON.bellOn : ICON.bellOff;
  $("#gear").innerHTML = ICON.gear;

  const rail = $("#rail"), left = rail.scrollLeft, top = rail.scrollTop, sideTop = rail.querySelector(".side")?.scrollTop || 0;
  const L = P.layout;
  rail.className = "lay-" + L + (L === "carousel" ? " scroller hscroll" : L === "focus" ? "" : " scroller");
  if (!vis.length) {
    rail.className = "";
    rail.innerHTML = `<div class="calm" style="width:100%;height:100%"><div><div class="big" id="bigclock">${clockText()}</div>
      <div class="msg">${P.show === "attention" ? "Nada urgente · ningún agente te necesita" : "Todo tranquilo · ningún agente trabajando"}</div></div></div>`;
  } else if (L === "list") rail.innerHTML = vis.map(rowHTML).join("");
  else if (L === "grid") rail.innerHTML = vis.map(tileHTML).join("");
  else if (L === "focus") rail.innerHTML = cardHTML(vis[0]) + `<div class="side scroller">${vis.slice(1).map(miniHTML).join("") || '<div class="none">Nada más en marcha</div>'}</div>`;
  else rail.innerHTML = vis.map(cardHTML).join("") + `<div style="flex:none;width:10px"></div>`;
  rail.scrollLeft = left; rail.scrollTop = top;
  const side = rail.querySelector(".side"); if (side) side.scrollTop = sideTop;
  dots();
  paintAlerts();
  if (S.sel) renderDetail();
}

function yesNo(a) { return a.k === "waiting" && a.handle ? `<button class="sbtn yes" data-act="yes">Sí</button><button class="sbtn" data-act="no">No</button>` : ""; }
function rowHTML(a) {
  return `<div class="row ${a.k}" data-key="${esc(a.key)}"><span class="dot"></span>
    <div class="rtx"><div class="rt">${esc(titleOf(a))}</div><div class="rn">${esc(nowText(a) || a.w.repo + " · " + (a.w.displayName || ""))}</div></div>
    ${yesNo(a) || `<span class="rtime">${a.fresh && a.k === "done" ? '<span class="new" style="display:inline-block;margin-right:8px"></span>' : ""}${ago(a.at)}</span>`}</div>`;
}
function tileHTML(a) {
  const yn = yesNo(a);
  return `<div class="tile ${a.k}" data-key="${esc(a.key)}">
    <div class="pill"><span class="dot"></span>${LABEL[a.k]}${a.fresh && a.k === "done" ? '<span class="new"></span>' : ""}<span class="t">${ago(a.at)}</span></div>
    <div class="tt" >${esc(titleOf(a))}</div>
    ${yn ? "" : `<div class="tn">${esc(nowText(a))}</div>`}
    ${yn ? `<div class="ans">${yn}</div>` : `<div class="tw">${esc(a.w.repo)} · ${esc(a.w.displayName || "")}</div>`}</div>`;
}
function miniHTML(a) {
  return `<div class="mini ${a.k}" data-key="${esc(a.key)}"><span class="dot"></span>
    <div class="rtx"><div class="rt">${esc(titleOf(a))}</div><div class="rn">${LABEL[a.k]} · ${ago(a.at)}</div></div></div>`;
}

function renderSettings() {
  $("#sbody").innerHTML = SETTINGS.map(([k, label, hint, opts]) => `<div class="srow"><div class="slbl"><b>${label}</b><span>${hint}</span></div>${
    opts ? `<div class="seg">${opts.map(([v, t]) => `<button class="${P[k] === v ? "on" : ""}" data-act="set" data-k="${k}" data-v="${v}">${t}</button>`).join("")}</div>`
         : `<button class="tog ${P[k] ? "on" : ""}" data-act="toggle" data-k="${k}"></button>`}</div>`).join("");
}

function cardHTML(a) {
  const answers = a.k === "waiting" && a.handle
    ? `<div class="answers"><button class="btn yes" data-act="yes">${ICON.check} Sí</button><button class="btn no" data-act="no">No</button></div>`
    : `<div class="where">${esc(a.w.repo)} · ${esc(a.w.displayName || "")}</div>`;
  return `<div class="card ${a.k}" data-key="${esc(a.key)}">
    <div class="pill"><span class="dot"></span>${LABEL[a.k]}${a.fresh && a.k === "done" ? '<span class="new"></span>' : ""}<span class="t">${ago(a.at)}</span></div>
    <div class="title">${esc(titleOf(a))}</div>
    <div class="now">${esc(nowText(a))}</div>
    ${answers}
  </div>`;
}

function dots() {
  const rail = $("#rail"), cards = P.layout === "carousel" ? rail.querySelectorAll(".card") : [];
  $("#dots").style.display = P.layout === "carousel" ? "" : "none";
  const per = 2, pages = Math.ceil(cards.length / per);
  if (pages <= 1) { $("#dots").innerHTML = ""; return; }
  const page = Math.round(rail.scrollLeft / (rail.scrollWidth - rail.clientWidth || 1) * (pages - 1));
  $("#dots").innerHTML = Array.from({ length: pages }, (_, i) => `<i class="${i === page ? "on" : ""}"></i>`).join("");
}
$("#rail").addEventListener("scroll", dots);

/* ── detail ── */
function showOnly(id) { for (const v of ["home", "detail", "settings"]) $("#" + v).classList.toggle("hidden", v !== id); }
function showDetail(key) { S.sel = key; S.view = "summary"; S.screenText = ""; lastSig = ""; closeAlerts(); showOnly("detail"); renderDetail(); }
function showHome() { S.sel = null; showOnly("home"); }
function showSettings() { S.sel = null; renderSettings(); $("#sbody").scrollTop = 0; showOnly("settings"); }

let lastSig = "";
function renderDetail() {
  const a = S.byKey.get(S.sel);
  if (!a) { showHome(); return; }
  const view = S.view === "term" && a.handle ? "term" : "summary";
  const sig = [a.key, a.k, a.toolName, a.toolInput, (a.lastAssistantMessage || "").length, view, a.fresh, a.handle].join("|");
  $("#dpill").className = "pill " + a.k;
  $("#dpill").innerHTML = `<span class="dot"></span>${LABEL[a.k]}<span class="t">&nbsp;· ${ago(a.at)}</span>`;
  if (sig === lastSig) { if (view === "term") paintTerm(); return; }
  lastSig = sig;
  $("#dtitle").textContent = titleOf(a);
  $("#dwhere").textContent = `${a.w.repo} · ${a.w.displayName || ""} · ${a.agentType || ""}`;

  const B = $("#dbody");
  B.className = view === "term" ? "term" : "";
  if (view === "term") { B.textContent = S.screenText || "Cargando…"; refreshTerm(); }
  else {
    const parts = [];
    if (a.k === "waiting") parts.push(`<p class="ask">${esc(askText(a))}</p>`);
    else if (a.k === "working") parts.push(`<p class="lbl">Ahora</p><p>${esc(toolText(a) || "Pensando…")}</p>`);
    const msg = String(a.lastAssistantMessage || "").split("\n").map(clean).filter(Boolean).slice(0, 8);
    if (msg.length) parts.push(`<p class="lbl" style="margin-top:14px">Último mensaje</p>` + msg.map(l => `<p>${esc(l)}</p>`).join(""));
    if (!parts.length) parts.push(`<p style="color:var(--muted-foreground)">Sin detalles todavía.</p>`);
    B.innerHTML = parts.join("");
    B.scrollTop = 0;
  }

  const acts = [];
  if (a.k === "waiting" && a.handle) acts.push(`<button class="btn yes" data-act="yes">${ICON.check} Sí</button>`, `<button class="btn no" data-act="no">No</button>`);
  acts.push(`<button class="btn primary" data-act="open">${ICON.open} Abrir en Orca</button>`);
  if (a.handle) acts.push(view === "term"
    ? `<button class="btn" data-act="summary">${ICON.text} Resumen</button>`
    : `<button class="btn" data-act="term">${ICON.term} Terminal</button>`);
  if (a.fresh && a.k !== "waiting") acts.push(`<button class="btn" data-act="seen">${ICON.check} Visto</button>`);
  $("#dactions").innerHTML = acts.join("");
}

let termBusy = false;
async function refreshTerm() {
  const a = S.byKey.get(S.sel);
  if (!a?.handle || termBusy || S.view !== "term") return;
  termBusy = true;
  const r = await orca("terminal", "read", "--terminal", a.handle, "--screen");
  termBusy = false;
  const tail = r?.result?.terminal?.tail;
  if (!Array.isArray(tail)) { S.screenText = "No se pudo leer el terminal."; paintTerm(); return; }
  let e = tail.length; while (e && !tail[e - 1].trim()) e--;
  S.screenText = tail.slice(Math.max(0, e - 40), e).map(l => l.replace(/\s+$/, "")).join("\n");
  paintTerm();
}
let painted = "";
function paintTerm() {
  const B = $("#dbody"); if (!B.classList.contains("term") || S.screenText === painted) return;
  B.textContent = painted = S.screenText; B.scrollTop = B.scrollHeight;
}
setInterval(() => { if (S.sel && S.view === "term") refreshTerm(); }, 1500);

/* ── actions ── */
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 1600); }
const ok = (r, what) => { if (r?.ok) return true; toast(what + ": " + String(r?.error?.message || "error").slice(0, 50)); return false; };
const wtSel = a => a.w.address?.worktree || "id:" + a.w.worktreeId;

async function act(name, a) {
  if (name === "back") return showHome();
  if (name === "settings") return showSettings();
  if (name === "dismiss") return closeAlerts();
  if (name === "sound") { S.sound = !S.sound; store.set("sound", S.sound); toast(S.sound ? "Sonido activado" : "Sonido desactivado"); return render(); }
  if (!a) return;
  if (name === "view") return showDetail(a.key);
  if (name === "open") {
    call("focusOrca");   // first, while the deck is still the active app (macOS only lets the active app hand over focus)
    const r = await orca("worktree", "activate", "--worktree", wtSel(a));
    if (a.handle) await orca("terminal", "switch", "--terminal", a.handle); else if (!ok(r, "No se pudo abrir")) return;
    toast("Abierto en Orca");
  }
  if (name === "yes" || name === "no") {
    // Enter accepts the highlighted (default "Yes") option; Esc declines. Works for Claude Code and Codex prompts.
    const r = await orca("terminal", "send", "--terminal", a.handle, "--text", name === "yes" ? "\r" : "\u001b");
    if (ok(r, "No se envió")) { toast(name === "yes" ? "Aprobado" : "Rechazado"); if (S.alertKey === a.key) closeAlerts(); }
  }
  if (name === "term" || name === "summary") { S.view = name; lastSig = ""; painted = ""; renderDetail(); }
  if (name === "seen") { const r = await orca("worktree", "set", "--worktree", wtSel(a), "--read"); if (ok(r, "Error")) toast("Marcado como visto"); }
}

/* Touches from the phone arrive as mouse drags: drag to scroll, tap to click. */
document.addEventListener("mousedown", e => {
  const sc = e.target.closest(".scroller"); S.lastTouch = Date.now(); moved = false;
  if (!sc) return;
  drag = { sc, x: e.clientX, y: e.clientY, l: sc.scrollLeft, t: sc.scrollTop, h: sc.classList.contains("hscroll"), v: 0, lx: e.clientX, lt: performance.now() };
  moved = false;
});
document.addEventListener("mousemove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) > 8) { moved = true; if (drag.h) drag.sc.classList.add("dragging"); }
  if (!moved) return;
  if (drag.h) { drag.sc.scrollLeft = drag.l - dx; const now = performance.now(); drag.v = (e.clientX - drag.lx) / Math.max(1, now - drag.lt); drag.lx = e.clientX; drag.lt = now; }
  else drag.sc.scrollTop = drag.t - dy;
});
document.addEventListener("mouseup", () => {
  if (drag?.h && moved) {
    const rail = drag.sc, cards = [...rail.querySelectorAll(".card")];
    const step = cards.length > 1 ? cards[1].offsetLeft - cards[0].offsetLeft : rail.clientWidth;
    let idx = Math.round(rail.scrollLeft / step);
    if (drag.v < -0.4) idx = Math.ceil(rail.scrollLeft / step); else if (drag.v > 0.4) idx = Math.floor(rail.scrollLeft / step);
    rail.scrollTo({ left: Math.max(0, idx * step), behavior: "smooth" });
    setTimeout(() => rail.classList.remove("dragging"), 400);
  }
  drag = null;
  if (S.dirty) render();
  // Touching the phone activates the deck; hand the keyboard back to the Mac app the user was in,
  // unless this tap is "Abrir en Orca" (which brings Orca forward itself). Runs after the click handler.
  setTimeout(() => { if (!holdFocus) call("yield"); holdFocus = false; }, 0);
});
document.addEventListener("click", e => {
  if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; return; }
  const btn = e.target.closest("[data-act]");
  if (btn?.dataset.act === "open") holdFocus = true;
  if (btn?.dataset.act === "set") { const k = btn.dataset.k; return setPref(k, typeof DEF[k] === "number" ? +btn.dataset.v : btn.dataset.v); }
  if (btn?.dataset.act === "toggle") return setPref(btn.dataset.k, !P[btn.dataset.k]);
  const holder = e.target.closest("[data-key]");
  const key = holder?.dataset.key || S.sel;
  if (btn) { act(btn.dataset.act, S.byKey.get(key)); return; }
  if (holder) showDetail(key);
}, true);

/* After a minute without touches, go back to the overview. */
setInterval(() => { if (P.autoHome && (S.sel || !$("#settings").classList.contains("hidden")) && Date.now() - S.lastTouch > 60e3) showHome(); }, 5e3);

/* ── clock, liveness, fit ── */
const clockText = () => new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
setInterval(() => {
  $("#clock").textContent = clockText(); const b = $("#bigclock"); if (b) b.textContent = clockText();
  if (Date.now() - S.lastOk > 8000) setOnline(false);
}, 1000);
function fit() { document.documentElement.style.setProperty("--fit", Math.min(innerWidth / 936, innerHeight / 526)); }
addEventListener("resize", fit); fit();
$("#clock").textContent = clockText();

/* Browser preview with mock data when there is no native shell. */
window.mock = () => {
  const n = Date.now(), A = (i, state, x = {}) => ({ paneKey: "t" + i + ":l", state, agentType: "claude", stateStartedAt: n - (i + 1) * 260e3,
    conversationName: ["Migrar la base de datos a Postgres 17", "Arreglar el login con Google", "Landing de Black Friday", "Tests e2e del onboarding"][i],
    lastAssistantMessage: "## Hecho\nHe cambiado **3 archivos** y los tests pasan.\n- `auth.ts`", ...x });
  deck.update({ ok: true, result: { worktrees: [
    { worktreeId: "r::a", repo: "trainerstudio", displayName: "postgres-17", agents: [A(0, "waiting", { toolName: "Bash", toolInput: "pnpm prisma migrate deploy" })] },
    { worktreeId: "r::b", repo: "trainerstudio", displayName: "fix-login", agents: [A(1, "working", { toolName: "Edit", toolInput: "src/auth/google.ts" })] },
    { worktreeId: "r::c", repo: "landing", displayName: "black-friday", agents: [A(2, "done", { activity: { unread: true } }), A(3, "working", { toolName: "Bash", toolInput: "pnpm test:e2e" })] },
  ] } }, { result: { terminals: [{ tabId: "t0", leafId: "l", handle: "h0" }] } });
};
if (!native) { mock(); const v = new URLSearchParams(location.search).get("view");
  if (v === "settings") showSettings(); if (v === "banner" || v === "full") { P.alert = v; S.alertKey = "r::a|t0:l"; paintAlerts(); } }
</script>
</body>
